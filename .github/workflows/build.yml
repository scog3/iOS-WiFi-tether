name: Build

on:
  push:
    paths-ignore:
      - README.md
      - LICENSE
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld dpkg dpkg-dev git curl
          if ! sudo apt-get install -y -qq ldid; then
            sudo curl -fsSL -o /usr/local/bin/ldid \
              https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64
            sudo chmod +x /usr/local/bin/ldid
          fi

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          PKG_VERSION="$(tr -d '[:space:]' < VERSION)-${GITHUB_RUN_NUMBER}" bash build-linux.sh 2>&1 | tee build.log

      - name: Release notes from CHANGELOG.md
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # The section of CHANGELOG.md for this version, without its heading.
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "No changelog entry for $VERSION." > notes.md
          printf '\nInstall: open this page in Safari on the iPhone, tap the .deb, then open it in Filza or Sileo.\n' >> notes.md
          cat notes.md

      - name: Publish release v${{ env.VERSION }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v$VERSION"
          # The old single "latest" release from earlier builds is replaced by versioned ones.
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Same version built again: replace its .deb and notes, keep the release.
            # Replace the .deb (its name has the build number, so remove the old ones first)
            gh release view "$TAG" --json assets -q '.assets[].name' | grep '\.deb$' | while read -r a; do
              gh release delete-asset "$TAG" "$a" --yes
            done
            gh release upload "$TAG" build/*.deb --clobber
            gh release edit "$TAG" --notes-file notes.md --latest
          else
            gh release create "$TAG" build/*.deb \
              --target "$GITHUB_SHA" \
              --title "WiFi Tether $VERSION" \
              --notes-file notes.md \
              --latest
          fi

      - name: Make the Sileo repo
        run: bash make-repo.sh build/*.deb

      - name: Upload the repo for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: repo

      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

  # Publishes the Sileo repo at https://<user>.github.io/<repository>/
  # Needs Settings -> Pages -> Source: GitHub Actions (once).
  repo:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
