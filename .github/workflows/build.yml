name: Build

on:
  push:
    paths-ignore:
      - README.md
      - LICENSE
  workflow_dispatch:

permissions:
  contents: write

# Your Sileo repo: one GitHub repository for all your projects, served by
# GitHub Pages. Each build adds this package to it (see "Publish to your Sileo
# repo" below, and README: Build it yourself).
env:
  REPO_REPOSITORY: scog3/repo
  REPO_URL: https://scog3.github.io/repo/

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  # The band switcher's hand-over add-on runs inside iOS's Wi-Fi service, so
  # on A12 and newer it has to be arm64e, which only Apple's compiler builds
  # properly. This job builds it (arm64 + arm64e) on a Mac for the main build.
  # If it fails, the main build goes ahead with an arm64-only add-on.
  roam:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Build the hand-over add-on (arm64 + arm64e)
        run: |
          xcrun -sdk iphoneos clang -arch arm64 -arch arm64e -miphoneos-version-min=15.0 -Os -Wall \
            -fobjc-arc -dynamiclib \
            -install_name /var/jb/Library/MobileSubstrate/DynamicLibraries/WiFiTetherRoam.dylib \
            src/roam/roam.m -framework Foundation -framework CoreFoundation -o WiFiTetherRoam.dylib
          lipo -info WiFiTetherRoam.dylib

      # The status bar add-on (the band on the Wi-Fi icon) loads into every
      # app, SpringBoard included, which are arm64e on A12 and newer too.
      - name: Build the status bar add-on (arm64 + arm64e)
        continue-on-error: true
        run: |
          xcrun -sdk iphoneos clang -arch arm64 -arch arm64e -miphoneos-version-min=15.0 -Os -Wall \
            -fobjc-arc -dynamiclib \
            -install_name /var/jb/Library/MobileSubstrate/DynamicLibraries/WiFiTetherBar.dylib \
            src/bar/bar.m -framework UIKit -framework QuartzCore -framework CoreGraphics -framework CoreText -framework Foundation -o WiFiTetherBar.dylib
          lipo -info WiFiTetherBar.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: roam-dylib
          path: |
            WiFiTetherRoam.dylib
            WiFiTetherBar.dylib

  build:
    needs: roam
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get the arm64e add-on from the Mac build
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: roam-dylib
          path: prebuilt

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld dpkg dpkg-dev git curl
          if ! sudo apt-get install -y -qq ldid; then
            sudo curl -fsSL -o /usr/local/bin/ldid \
              https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64
            sudo chmod +x /usr/local/bin/ldid
          fi

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          export ROAM_DYLIB="$PWD/prebuilt/WiFiTetherRoam.dylib"
          export BAR_DYLIB="$PWD/prebuilt/WiFiTetherBar.dylib"
          PKG_VERSION="$(tr -d '[:space:]' < VERSION)-${GITHUB_RUN_NUMBER}" bash build-linux.sh 2>&1 | tee build.log

      # Shows on the run's page whether the Mac (arm64e) part made it in.
      - name: Check the hand-over add-on
        shell: bash
        run: |
          ARCHS="$(cat build/roam-archs.txt 2>/dev/null || echo unknown)"
          echo "ROAM_ARCHS=$ARCHS" >> "$GITHUB_ENV"
          if [[ " $ARCHS " == *" arm64e "* ]]; then
            echo "### ✅ Hand-over add-on: $ARCHS (includes A12 and newer)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ⚠️ Hand-over add-on: $ARCHS only. The Mac (arm64e) part didn't make it in, so A12 and newer move bands by rejoining" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Hand-over add-on::Built for $ARCHS only; the Mac (arm64e) part is missing"
          fi
          BAR="$(cat build/bar-archs.txt 2>/dev/null || echo unknown)"
          if [[ " $BAR " == *" arm64e "* ]]; then
            echo "### ✅ Status bar add-on: $BAR (includes A12 and newer)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ⚠️ Status bar add-on: $BAR only. The Mac (arm64e) part didn't make it in, so A12 and newer won't show the band on the Wi-Fi icon or the Personal Hotspot indicator" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Status bar add-on::Built for $BAR only; the Mac (arm64e) part is missing"
          fi

      - name: Release notes from CHANGELOG.md
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # The section of CHANGELOG.md for this version, without its heading.
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "No changelog entry for $VERSION." > notes.md
          printf '\nInstall: open this page in Safari on the iPhone, tap the .deb, then open it in Filza or Sileo.\n' >> notes.md
          printf 'Band switcher hand-over built for: %s.\n' "$ROAM_ARCHS" >> notes.md
          cat notes.md

      - name: Publish release v${{ env.VERSION }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v$VERSION"
          # The old single "latest" release from earlier builds is replaced by versioned ones.
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Same version built again: replace its .deb and notes, keep the release.
            # Replace the .deb (its name has the build number, so remove the old ones first)
            gh release view "$TAG" --json assets -q '.assets[].name' | grep '\.deb$' | while read -r a; do
              gh release delete-asset "$TAG" "$a" --yes
            done
            gh release upload "$TAG" build/*.deb --clobber
            gh release edit "$TAG" --title "Tether & Band $VERSION" --notes-file notes.md --latest
          else
            gh release create "$TAG" build/*.deb \
              --target "$GITHUB_SHA" \
              --title "Tether & Band $VERSION" \
              --notes-file notes.md \
              --latest
          fi

      # Adds this package to your Sileo repo (REPO_REPOSITORY) and pushes it;
      # GitHub Pages then serves it at REPO_URL. Needs a REPO_TOKEN secret: a
      # fine-grained token with Contents: Read and write on that repository.
      # Without it, the release still goes out and the repo is left as it was.
      - name: Publish to your Sileo repo
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
        shell: bash
        run: |
          if [ -z "$REPO_TOKEN" ]; then
            echo "::warning title=Sileo repo::Not updated: add a REPO_TOKEN secret (README: Build it yourself)"
            echo "### ⚠️ Sileo repo not updated: no REPO_TOKEN secret" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          VER="$(dpkg-deb -f build/*.deb Version)"
          # Another project may publish at the same time: if the push is
          # refused, start again from the newest copy (up to 3 tries).
          for try in 1 2 3; do
            rm -rf sileo-repo
            git clone -q --depth 1 "https://x-access-token:${REPO_TOKEN}@github.com/${REPO_REPOSITORY}.git" sileo-repo
            bash make-repo.sh sileo-repo build/*.deb
            cd sileo-repo
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if git diff --cached --quiet; then echo "Repo unchanged"; exit 0; fi
            git commit -q -m "WiFi Tether & Band Switcher $VER"
            if git push -q origin HEAD:main; then
              echo "### ✅ Published $VER to ${REPO_URL}" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            cd ..
            sleep $((try * 5))
          done
          echo "::error title=Sileo repo::Couldn't push to ${REPO_REPOSITORY}"
          exit 1

      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
