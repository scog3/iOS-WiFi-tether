name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld dpkg git curl
          if ! sudo apt-get install -y -qq ldid; then
            sudo curl -fsSL -o /usr/local/bin/ldid \
              https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64
            sudo chmod +x /usr/local/bin/ldid
          fi

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          bash build-linux.sh 2>&1 | tee build.log

      - name: Publish the .deb as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/*.deb \
            --target "$GITHUB_SHA" \
            --title "Latest build" \
            --notes "Open this page in Safari on the iPhone and tap the .deb to download it."

      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
