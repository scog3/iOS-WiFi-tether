name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install ldid dpkg

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          bash build.sh 2>&1 | tee build.log

      - name: Publish the .deb as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/*.deb \
            --target "$GITHUB_SHA" \
            --title "Latest build" \
            --notes "Open this page in Safari on the iPhone and tap the .deb to download it."

      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
